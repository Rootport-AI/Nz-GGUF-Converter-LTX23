[source]
repo_id = "SulphurAI/Sulphur-2-base"
filename = "sulphur_distil_bf16.safetensors"
expected_size = 46139885414
local_dir = "safetensors"

[reference]
# Default assumes this repo and Nz-LTX23-backend are cloned as sibling
# directories (the Rootport-AI GitHub org layout). Override with --reference
# if your layout differs; extract-typemap/convert/verify already report
# "not found" and stop gracefully when this path does not resolve (e.g. a
# standalone clone without the backend checked out alongside it).
gguf_path = "../Nz-LTX23-backend/models/ltx-2.3-gguf/LTX-2.3-distilled-1.1/LTX-2.3-22B-distilled-1.1-Q4_K_M.gguf"
typemap_path = "typemap/ltx23_q4km_typemap.json"

[output]
dir = "output"
filename = "Sulphur-2-base-distil-Q4_K_M.gguf"

# Opt-in LTX 2.5 profile.  The legacy [source]/[reference]/[output] tables
# remain the LTX 2.3 default. E1-E3 are source-locked; conversion remains
# fail-closed until a separately reviewed approved E4 map is checked in.
[profiles.ltx25]
source_repo_id = "Lightricks/LTX-2.5"
artifact_revision = "dd53cc2cd45bbeaa3563dfb575cba3f49cf44761"
source_filename = "diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors"
source_expected_size = 42018190584
source_sha256 = "31eb3cad89b9e54e99dd3baf286f70825ac4f6c660a70d9184d895be76d7bff4"
lfs_sha256 = "31eb3cad89b9e54e99dd3baf286f70825ac4f6c660a70d9184d895be76d7bff4"
git_blob_oid = "3ba48d13c75fd5df2e868aa8c07b0c5119a6116f"
gated = "auto"
license_id = "ltx-2-community-license-agreement"
license_url = "https://huggingface.co/Lightricks/LTX-2.5/blob/dd53cc2cd45bbeaa3563dfb575cba3f49cf44761/LICENSE"
source_local_dir = ".artifacts/official-ltx25"
inventory_path = "typemap/ltx25_inventory.json"
builder_oracle_path = "typemap/ltx25_builder_oracle.json"
map_path = "typemap/ltx25_conversion_map.json" # approved 4,349-row E4; previous 4,091-row map is fail-closed stale
draft_map_path = "typemap/ltx25_conversion_map.draft.json"
quant_workers = 4 # bounded Q4_K tasks; CLI range is 1-8 (ltx23 remains 1)
output_dir = "output"
output_filename = "LTX-2.5-22B-distilled-transformer.gguf"

# Opt-in gemma4-ltx25 profile: the LTX-fine-tuned Gemma 4 text encoder
# (686 tensors: 664 backbone + embed/norm + aggregate_embed + projectors +
# vision tower + 5 U8 sidecar files). Independent of [profiles.ltx25] --
# a different source file, no component exclusion (every tensor emits).
[profiles."gemma4-ltx25"]
source_repo_id = "Lightricks/LTX-2.5"
artifact_revision = "dd53cc2cd45bbeaa3563dfb575cba3f49cf44761"
source_filename = "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
source_expected_size = 26263860594
source_sha256 = "1c647a94c0e902fb87f9a403cbca36a8b6d8e5867094442df1b41ae557cfd1c6"
lfs_sha256 = "1c647a94c0e902fb87f9a403cbca36a8b6d8e5867094442df1b41ae557cfd1c6"
git_blob_oid = "" # not captured by download-5files (sha256-only report); not required for lock completeness
gated = "auto"
license_id = "ltx-2-community-license-agreement"
license_url = "https://huggingface.co/Lightricks/LTX-2.5/blob/dd53cc2cd45bbeaa3563dfb575cba3f49cf44761/LICENSE"
source_local_dir = ".artifacts/official-ltx25" # source_filename below already carries the text_encoders/ subfolder
inventory_path = "typemap/gemma4_ltx25_inventory.json"
builder_oracle_path = "typemap/gemma4_ltx25_builder_oracle.json"
map_path = "typemap/gemma4_ltx25_conversion_map.json"
draft_map_path = "typemap/gemma4_ltx25_conversion_map.draft.json"
quant_workers = 4 # bounded Q4_K/Q6_K tasks; CLI range is 1-8
output_dir = "output"
output_filename = "LTX-2.5-gemma4-12b-text-encoder-Q4_K_M.gguf"

# PrunaVAED (pruned LTX-2.3 video VAE decoder) -- used by `convert-vae`.
# The three pins below (revision / sha256 / expected_size) identify PrunaVAED v2
# uniquely: v1 and v2 have byte-identical safetensors headers and differ only in
# their values, so size alone cannot tell them apart.
[prunavaed]
repo_id = "PrunaAI/PrunaVAED"
revision = "4baacd7ef66a6131439542c1f05872afe042e128"
filename = "vae/diffusion_pytorch_model.safetensors"
expected_size = 1327909418
sha256 = "4cbf0cbe6c185514d62c6c58c35dc42d7ea15924f34391e08be12f44bfccdf1d"
local_dir = "safetensors/prunavaed"
# The output must NOT contain the substring "video": the backend's model
# registry auto-registers every `video`-named .safetensors under its vae/
# directory as a selectable full video VAE, and a decoder-only file there would
# break the encoder side
# (https://github.com/Rootport-AI/Nz-Videomni/blob/main/Docs/PRUNAVAED_WORKORDER.md
# §4.1).
out_dir = "output"
out_filename = "PrunaVAED-decoder-bf16.safetensors"
# Optional: the stock video VAE, used only for the latent-statistics
# cross-check (self-verification item 6). Skipped when absent. Default assumes
# this repo and Nz-LTX23-backend are cloned as sibling directories -- see the
# note on [reference].gguf_path above.
reference_vae_path = "../Nz-LTX23-backend/models/ltx-2.3-components/vae/LTX23_video_vae_bf16.safetensors"
